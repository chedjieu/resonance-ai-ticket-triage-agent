[project]
name = "RTTA-AI-Multi-Agent-Ticket-Triage"
version = "0.1.0"
description = "Resonance Technologies ticket triage agent (Project 2)"
requires-python = ">=3.11,<3.13"

dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-aws>=0.2.10",
    "langchain-google-vertexai>=2.0.10",
    "google-cloud-aiplatform[agent_engines,langchain]>=1.74.0",
    "boto3>=1.35.40",
    "numpy>=1.26.4,<2",
    "langgraph>=0.2.50,<0.3",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langgraph-checkpoint-postgres>=2.0.7",
    "langsmith>=0.1.140",
    "bedrock-agentcore>=0.1.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.4",
    "bedrock-agentcore-starter-toolkit>=0.3.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]
